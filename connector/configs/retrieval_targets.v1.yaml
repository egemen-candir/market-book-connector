# retrieval_targets.v1.yaml — per-state retrieval classification for the connector.
#
# PLACEMENT: connector/configs/ (connector-side artifact). The accepted research corpus
# stays byte-identical (invariant #4) — this file is consumed by the catalog builder /
# retriever, never written into the source corpus.
#
# CRITERION (adjudicated per state from the actual signature/summary texts, 2026-07-02):
#   Classify by what the state DESCRIBES, not by how its signatures are measured.
#   observable          = a market condition a desk could remark on in natural prose
#                         (every signature is ultimately "computed"; that alone does not
#                         make a state methodological — see nguyen, ang_bekaert_params).
#   methodological_caveat = a property of estimation/inference machinery (an estimator's
#                         bias, a test's failure mode, a model's computational constraint,
#                         a filter's output definition). No desk commentary instantiates
#                         it without literalizing the method as a fake market event.
#   Operational tie-breaker (empirical, from the Phase-A generation run itself): states
#   whose probes came out as natural desk prose are observable (forbes -> probe_0169);
#   states that forced literalized method metaphors or produced identical "flips" are
#   methodological (rs_garch -> probe_0217; the identical-flip cluster).
#
# USE:
#   - Retriever/index builder: EXCLUDE methodological_caveat states from the embedding
#     index (they are not commentary-retrieval targets).
#   - eval_retrieval.py / Phase C: reachability denominator = observable states only;
#     methodological states reported in a separate bucket. Inverse check: if a
#     methodological state IS strongly retrieved by real commentary, flag it — either
#     the classification or the probe is wrong.
#   - PRD-3 evaluator: methodological states become standing caveat knowledge, injected
#     (summary text) when a candidate from a family listed in `caveats_families` is in
#     the shortlist. ~5 short summaries; trivial context cost with family gating.
#
# classification_version: 1
# adjudicated_by: project maintainer (model-assisted review)
# corpus: market_book_catalog.stage6_enriched.json
#         sha256 68b4c77393cf426034197ee364fe30e31f6e5586379a43537f530b802cf05f1a

states:
  # ---- methodological_caveat (5) ------------------------------------------------
  - state_id: state_hamilton_rs_filter_equations_001
    class: methodological_caveat
    rationale: >-
      Describes the Hamilton filter's own output (real-time filtered regime
      probabilities) — modeling machinery, not a market condition. Desk prose about
      "regime odds" maps to the regime states themselves, not to the filter.
    caveats_families: [regime_switching]

  - state_id: state_hamilton_rs_garch_path_dependence_003
    class: methodological_caveat
    rationale: >-
      Computational intractability constraint of RS-GARCH estimation. probe_0217
      could only render it by literalizing the method ("screens hanging on the
      calculations") — the classifier tie-breaker case.
    caveats_families: [regime_switching, volatility_clustering]

  - state_id: state_hamilton_arch_ols_overreject_001
    class: methodological_caveat
    rationale: >-
      Self-describes as "a market research condition": OLS t-tests overreject under
      GARCH errors. Its desk-visible shadow ("everything looks significant in this
      vol regime") is the volatility-clustering state; commentary should retrieve
      that, and the evaluator applies this caveat to significance claims.
    caveats_families: [volatility_clustering]

  - state_id: state_hasbrouck_gibbs_estimator_001
    class: methodological_caveat
    rationale: >-
      An estimability condition (trading costs recoverable from daily closes via a
      Gibbs sampler on the Roll model). Desks remark on costs being high — an
      observable covered by the liquidity states — never on their estimability.
    caveats_families: [liquidity_microstructure]

  - state_id: state_hasbrouck_small_sample_bias_005
    class: methodological_caveat
    rationale: >-
      An estimator-bias regime (too few trades for the Gibbs sampler to see spread
      reversals). The TRIGGER (ghost-town book, sparse prints) is observable and is
      covered by the illiquidity states; the state's knowledge content is the
      estimator's downward bias, which is machinery. (Zero signatures; summary-only.)
    caveats_families: [liquidity_microstructure]

  # ---- observable (26) -----------------------------------------------------------
  - {state_id: state_amihud_crosssection_premium_002,  class: observable}
  - {state_id: state_amihud_illiq_formula_001,         class: observable}
  - {state_id: state_amihud_illiq_persistence_004,     class: observable}
  - {state_id: state_amihud_size_interaction_005,      class: observable}
  - {state_id: state_amihud_timeseries_premium_003,    class: observable}
  - {state_id: state_ang_2011_exceedance_asymmetry_003, class: observable}
  - {state_id: state_ang_2011_fat_tails_mixture_001,   class: observable}
  - {state_id: state_ang_bekaert_bear_correlation_002, class: observable}
  - state_id: state_ang_bekaert_regime_params_001
    class: observable
    rationale: >-
      Parameters are estimates, but the state is "the bear regime is active,
      characterized by near-zero mean and ~80% higher vol" — desk-expressible
      (probe_0087 read naturally: "treading water, swings much wilder").
  - {state_id: state_billio_financial_sector_comovement_001, class: observable}
  - {state_id: state_billio_granger_systemic_buildup_002,    class: observable}
  - {state_id: state_billio_hedge_fund_illiquidity_003,      class: observable}
  - {state_id: state_cho_engle_market_conditions_004,  class: observable}
  - {state_id: state_cho_engle_moneyness_003,          class: observable}
  - {state_id: state_cho_engle_underlying_spread_002,  class: observable}
  - state_id: state_cho_engle_volume_insignificant_001
    class: observable
    rationale: >-
      An absence-observation, but a real one desks make ("massive paper but spreads
      not budging" — probe_0147 read naturally). Zero signatures in the corpus:
      flag as a PRD-1.6 gloss/signature candidate, not a classification issue.
  - state_id: state_forbes_heteroscedasticity_bias_001
    class: observable
    rationale: >-
      The genuine borderline, settled observable. Dual-natured: formally a
      measurement-distortion state, but its manifestation — correlations APPEAR to
      spike when vol spikes, partly as artifact — is a first-class self-skeptical
      desk read. probe_0169 instantiated it in natural prose without literalizing
      ("might just be an illusion from the extreme variance"), which is the
      tie-breaker. Retrieving it on "everything's suddenly correlated but vol is
      exploding" is correct and valuable.
  - {state_id: state_gatev_pairs_mean_reversion_001,   class: observable}
  - {state_id: state_hamilton_arch_volatility_clustering_004, class: observable}
  - {state_id: state_hasbrouck_january_effect_004,     class: observable}
  - {state_id: state_hasbrouck_return_premium_003,     class: observable}
  - {state_id: state_hasbrouck_taq_correlation_002,    class: observable}
  - {state_id: state_hurst_tsmom_trend_following_001,  class: observable}
  - {state_id: state_lo_mackinlay_short_horizon_predictability_001, class: observable}
  - state_id: state_nguyen_three_state_hmm_001
    class: observable
    rationale: >-
      Signatures are model-mediated (filtered HMM probabilities, PESR) — but the
      STATE is a market regime condition (bull/bear/high-vol cycling), which is
      desk-expressible. Signature register is an F4 gloss problem, not a
      classification problem. The criterion is what the state describes.
  - {state_id: state_poterba_summers_long_horizon_mean_reversion_001, class: observable}

# Family membership for caveat gating (evaluator-side; deterministic lookup).
families:
  regime_switching:
    - state_ang_bekaert_bear_correlation_002
    - state_ang_bekaert_regime_params_001
    - state_nguyen_three_state_hmm_001
    - state_hamilton_arch_volatility_clustering_004
  volatility_clustering:
    - state_hamilton_arch_volatility_clustering_004
    - state_ang_2011_fat_tails_mixture_001
    - state_ang_2011_exceedance_asymmetry_003
  liquidity_microstructure:
    - state_amihud_crosssection_premium_002
    - state_amihud_illiq_formula_001
    - state_amihud_illiq_persistence_004
    - state_amihud_size_interaction_005
    - state_amihud_timeseries_premium_003
    - state_hasbrouck_return_premium_003
    - state_hasbrouck_taq_correlation_002
    - state_billio_hedge_fund_illiquidity_003
    - state_cho_engle_underlying_spread_002
